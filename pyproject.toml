[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missioncut"
version = "0.1.0"
description = "Offline incident-response containment decision support simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.159.1",
    "networkx==3.7",
    "pydantic==2.14.1",
    "psycopg[binary]==3.2.10",
    "uvicorn==0.54.0",
]

# Vercel installs this directory as a package; restrict discovery to the API package
# so other top-level folders (frontend, datasets, tests) are never picked up.
[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.vercel]
entrypoint = "backend.main:app"
